plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.10.0'
}

group = 'com.example'
version = providers.gradleProperty('releaseVersion').getOrElse('0.0.1-SNAPSHOT')
description = 'raftimplementation'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.webjars:webjars-locator-lite'
	// Dashboard libraries, served locally from /webjars. htmx stays on 2.x until 4.x has settled.
	runtimeOnly 'org.webjars.npm:htmx.org:4.0.0'
	runtimeOnly 'org.webjars.npm:idiomorph:0.7.4'
	runtimeOnly 'org.webjars.npm:cytoscape:3.34.4'
	implementation 'com.h2database:h2'
	implementation 'io.grpc:grpc-netty-shaded:1.85.1'
	implementation 'io.grpc:grpc-protobuf:1.85.1'
	implementation 'io.grpc:grpc-stub:1.85.1'
	implementation 'io.grpc:grpc-services:1.85.1'
	implementation 'javax.annotation:javax.annotation-api:1.3.2'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
	protoc {
		artifact = 'com.google.protobuf:protoc:4.36.2'
	}
	plugins {
		grpc {
			artifact = 'io.grpc:protoc-gen-grpc-java:1.85.1'
		}
	}
	generateProtoTasks {
		all()*.plugins {
			grpc {
				option '@generated=omit'
			}
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

tasks.named('bootJar') {
	archiveFileName = 'raft.jar'
	// Declared here so that a new version rebuilds the jar, which would otherwise count as up to date
	manifest {
		attributes 'Implementation-Version': project.version
	}
}

// Only the executable jar is needed
tasks.named('jar') {
	enabled = false
}
