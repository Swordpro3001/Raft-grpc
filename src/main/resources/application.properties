# Without an explicit profile the application starts the dashboard and a local cluster.
spring.profiles.default=client

spring.application.name=raftimplementation
spring.main.banner-mode=off
spring.jmx.enabled=false

# There is no authentication, so only listen on this machine.
server.address=${raft.bind-address:127.0.0.1}

# Nodes only serve the REST API. The dashboard profile turns these back on.
spring.web.resources.add-mappings=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.thymeleaf.ThymeleafAutoConfiguration

# Node defaults. A profile or command line argument sets raft.node-id and the ports.
raft.http-port=${server.port:8080}
raft.cluster-size=5

# Logging
logging.level.com.example.raftimplementation=INFO
logging.level.io.grpc=WARN

# H2 database per node. WRITE_DELAY=0 makes every commit durable right away:
# Raft must not lose a vote or log entry that it has already acknowledged.
spring.datasource.url=jdbc:h2:file:./data/${raft.node-id}/raft-db;WRITE_DELAY=0
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
