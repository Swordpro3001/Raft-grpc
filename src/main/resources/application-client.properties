# Dashboard and local cluster supervisor. Does not take part in Raft itself.
raft.node.enabled=false
server.port=8080

# Serve the dashboard's static files and the libraries in /webjars
spring.web.resources.add-mappings=true

# Notices after an action use the session. Keep its ID out of URLs.
server.servlet.session.tracking-modes=cookie

# This process stores nothing
spring.autoconfigure.exclude= org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration, org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration, org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

# Keep the console readable: details of each node are in logs/
logging.level.root=WARN
logging.level.com.example.raftimplementation=WARN
