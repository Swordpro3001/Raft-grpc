name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:
  # The release workflow runs all of this before it publishes anything
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces the running check. Main and tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - run: ./gradlew build
      - run: bash .github/scripts/smoke-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 7

  # Slower and rarely different, so pull requests skip this. Everything on main and every release gets it.
  other-platforms:
    name: Test on ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - run: ./gradlew build
      - run: bash .github/scripts/smoke-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports-${{ matrix.os }}
          path: build/reports/tests/test/
          retention-days: 7
